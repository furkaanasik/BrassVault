services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brassvault
      POSTGRES_USER: brassvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brassvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brassvault -d brassvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/brassvault
      DB_USER: brassvault
      DB_PASSWORD: ${DB_PASSWORD:-brassvault}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?VAULT_MASTER_KEY .env dosyasinda tanimli olmali}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brassvault.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
